<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Нет соединения — Колибри</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c1c1e; text-align: center; padding: 24px; }
        img { width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 20px; display: block; animation: f 5s ease-in-out infinite; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 24px; color: #8e8e93; }
        button { height: 52px; padding: 0 28px; border: 0; border-radius: 16px; background: #2b2b2b; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        @keyframes f { 50% { transform: translateY(-8px) rotate(-3deg); } }
    </style>
</head>
<body>
    <main>
        <img src="assets/icons/icon-192.png" alt="">
        <h1>Нет соединения</h1>
        <p>Проверьте интернет — и букеты снова будут здесь.</p>
        <button type="button" onclick="location.reload()">Обновить</button>
    </main>
</body>
</html>
